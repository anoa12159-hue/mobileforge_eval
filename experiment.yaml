# DesignForge 实验配置
# 所有可调参数集中在此文件，代码中不硬编码

llm:
  # provider: chat_api | litellm
  #   chat_api   — 使用 Chat API，需要 APP_NAME/APP_ID/APP_KEY 环境变量
  #   litellm — 使用 LiteLLM 统一接口（推荐用于 API 中转服务）
  #             根据 model 前缀自动路由：anthropic/* → ANTHROPIC_API_BASE，
  #             openai/* → OPENAI_API_BASE，gemini/* → GEMINI_API_BASE 等。
  #             所有这些 *_API_BASE / *_API_KEY 在 env.sh 中已统一指向中转服务。
  provider: litellm
  endpoint: "http://chat-api.example.invalid/api/chat_completions"   # 仅 chat_api 模式生效；litellm 模式忽略

  # 模型名称
  #   chat_api 模式:   直接使用模型名 (gpt-5.1, claude-opus-4-6, etc.)
  #   litellm 模式: 必须带 provider 前缀
  #     - Claude  → anthropic/<name>   走中转服务的 Anthropic 协议
  #     - GPT     → openai/<name>      走中转服务的 OpenAI 协议
  #     - Gemini  → gemini/<name>      （是否提供视具体套餐而定）
  # 中转服务当前可用的模型 (查询 /v1/models 得到)：
  #   claude-sonnet-4-6              ← 默认主力
  #   claude-haiku-4-5-20251001      ← 便宜快速
  #   claude-opus-4-5-20251101 / claude-opus-4-6 / claude-opus-4-7   ← 高质量
  vision_model: anthropic/claude-sonnet-4-6    # Map 阶段 VLM 调用（须 supports_images: true）
  text_model: anthropic/claude-sonnet-4-6      # Reduce / Contract 纯文本推理
  agent_model: anthropic/claude-sonnet-4-6
  # agent_model: anthropic/claude-haiku-4-5-20251001
  # agent_model: anthropic/claude-opus-4-7

  # max_tokens 由模型注册表 (models.yaml) 中的 max_tokens 字段控制，不在此处设置
  max_retries: 3

  # Gemini 3 专属配置
  gemini_read_timeout: 720      # Gemini native API read 超时（秒），默认 420
  gemini_thinking_budget: 512   # Gemini 3 thinking token 预算，默认 1024；设 -1 为动态

pipeline:
  target_framework: react       # react | vue | nextjs
  css_strategy: tailwind        # tailwind | css-modules | styled-components
  max_parallel_pages: 10
  # 全局 agent 最大迭代次数（不设则默认 25），可被下方 agent_max_iterations 按角色覆盖
  # max_agent_iterations: 25
  todo_tool: true
  route_hints: true

  # AgenticPipeline 最大迭代次数（代码默认 50）
  agent_max_iterations:
    agentic: 70

# ------------------------------------------------------------------
# Tool I/O 限制 (Page / Merge / Build agents)
# ------------------------------------------------------------------
tools:
  # list_files / grep 忽略的目录名
  list_files_ignore_dir_names:
    - .designforge
    - node_modules
    - dist
    - .git
    - .vite
  # read_file 返回给 LLM 的最大字符数（0 = 不限制；代码默认 120000）
  read_file_max_chars: 0
  # run_command stdout/stderr 返回给 LLM 的最大字符数（0 = 不限制；代码默认 16000）
  run_command_max_output_chars: 50000

paths:
  input_dir: ./input/mobileforge
  output_dir: ./output/mobileforge

# ------------------------------------------------------------------
# Annotator 标注配置
# ------------------------------------------------------------------
annotator:
  # VLM 标注模型（须 supports_images: true）
  # 推荐 gemini-2.5-flash：视觉理解强、JSON 输出稳定、成本极低
  # 注意：必须用 openai/ 前缀，让 LiteLLM 走中转服务的 /v1/chat/completions
  model: openai/gemini-2.5-flash

  # Phase 1 并发数：单图描述的并行线程数（默认 8）
  workers: 8

# ------------------------------------------------------------------
# TestGen 自动化测试配置
# ------------------------------------------------------------------
testgen:
  # Phase 1 (run): VLM 点击兜底模型（DOM/文本定位失败时自动 fallback）
  # 推荐 gemini-2.5-flash：成本最低、GUI grounding 原生支持
  fallback_model: openai/gemini-2.5-flash
  # fallback_model: openai/gemini-3-flash-preview

  # Phase 2 (eval): VLM 视觉评估模型
  # 推荐 gemini-2.5-pro：细节感知强、多维度评分准确
  eval_model: openai/gemini-2.5-pro

  # Phase 2 (eval): VLM 评分并发线程数（默认 8）
  eval_workers: 8

# ------------------------------------------------------------------
# 模型注册表已迁移到独立的 models.yaml
# 如需覆盖个别模型的参数，可在此处添加 models 段，例如:
#   models:
#     claude-sonnet-4:
#       max_tokens: 32000    # 覆盖 models.yaml 中的默认值
# ------------------------------------------------------------------
